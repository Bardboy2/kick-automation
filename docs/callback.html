<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization Code — Clip Automation</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 48px 20px; min-height: 100vh; box-sizing: border-box;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f; color: #e8e8e8;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 .4em; color: #53fc18; }
  h1.err { color: #ff5c5c; }
  p { color: #b8b8b8; }
  .code {
    margin: 24px 0 12px; padding: 18px 20px;
    background: #1a1a1a; border: 1px solid #2f2f2f; border-radius: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px; word-break: break-all; user-select: all; color: #e8e8e8;
  }
  button {
    appearance: none; border: 0; cursor: pointer;
    background: #53fc18; color: #0b0b0b; font-weight: 600; font-size: 15px;
    padding: 12px 22px; border-radius: 8px;
  }
  button:active { transform: translateY(1px); }
  .note { margin-top: 28px; font-size: .9rem; color: #7a7a7a; }
</style>
</head>
<body>
<main>
  <div id="out">Reading authorization response…</div>
  <p class="note">
    This page runs entirely in your browser. The code below is not sent anywhere —
    copy it back into your terminal to finish connecting.
  </p>
</main>

<script>
(function () {
  var p     = new URLSearchParams(location.search);
  var code  = p.get("code");
  var err   = p.get("error");
  var desc  = p.get("error_description");
  var out   = document.getElementById("out");

  if (err) {
    out.innerHTML =
      '<h1 class="err">Authorization failed</h1>' +
      '<p>' + String(err).replace(/[<>&]/g, "") + '</p>' +
      (desc ? '<p>' + String(desc).replace(/[<>&]/g, "") + '</p>' : '') +
      '<p>Close this tab and run the script again.</p>';
    return;
  }

  if (!code) {
    out.innerHTML =
      '<h1 class="err">No code found</h1>' +
      '<p>This page expects to be opened by the authorization redirect.</p>';
    return;
  }

  out.innerHTML =
    '<h1>Authorized</h1>' +
    '<p>Copy this code and paste it into your terminal:</p>' +
    '<div class="code" id="c"></div>' +
    '<button id="b">Copy code</button>';

  document.getElementById("c").textContent = code;

  document.getElementById("b").addEventListener("click", function () {
    var btn = this;
    navigator.clipboard.writeText(code).then(function () {
      btn.textContent = "Copied";
      setTimeout(function () { btn.textContent = "Copy code"; }, 1800);
    }).catch(function () {
      btn.textContent = "Select the code above and copy manually";
    });
  });
})();
</script>
</body>
</html>
